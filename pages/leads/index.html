<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>线索 · 市场情报线索池</title>
  <link rel="stylesheet" href="../../assets/intelligence_workbench_v1.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="brand-row"><span class="brand-mark">G</span><span>全球增长洞察</span></div>
      <nav class="side-nav">
        <a href="../../index.html"><span class="nav-icon">□</span>周报中心</a>
        <a class="active" href="./"><span class="nav-icon">◇</span>线索</a>
        <a href="../market/"><span class="nav-icon">◎</span>行业研究</a>
        <a href="#"><span class="nav-icon">○</span>客户</a>
        <a href="#"><span class="nav-icon">◇</span>商机</a>
        <a href="#"><span class="nav-icon">▣</span>数据看板</a>
        <a href="#"><span class="nav-icon">☆</span>目标客户</a>
        <a href="#"><span class="nav-icon">⚙</span>设置中心</a>
      </nav>
      <footer class="sidebar-foot">
        <span>使用帮助</span>
        <span>联系我们</span>
      </footer>
    </aside>
    <main class="app-main">
      <header class="page-header">
        <div>
          <h1 class="page-title">线索</h1>
          <p class="page-sub">市场情报线索池 · 数据范围：3C · 美国 · Amazon / 公域PR · 更新：2026-06-04</p>
        </div>
        <div class="header-tools">
          <span>?</span><span>⌁</span><span class="user-pill"><span class="avatar">I</span>Intel Team</span>
        </div>
      </header>
      <section class="page-content">
        <nav class="tabs">
          <button class="tab active" data-tab="overview">线索总览</button>
          <button class="tab" data-tab="customers">客户动态</button>
          <button class="tab" data-tab="events">展会动态</button>
          <button class="tab" data-tab="tenders">招投标动态</button>
        </nav>

        <section class="filter-bar leads">
          <select id="type-filter" class="filter-select">
            <option value="">线索类型：全部</option>
            <option>客户动态</option>
            <option>展会动态</option>
            <option>招投标动态</option>
            <option>行业政策</option>
          </select>
          <select id="country-filter" class="filter-select"><option value="">国家/地区：全部</option></select>
          <select id="industry-filter" class="filter-select"><option value="">一级行业：全部</option></select>
          <select id="brand-filter" class="filter-select"><option value="">品牌/企业：全部</option></select>
          <select id="event-filter" class="filter-select">
            <option value="">事件类型：全部</option>
            <option>新品发布</option>
            <option>展会亮相</option>
            <option>渠道扩张</option>
            <option>行业政策</option>
            <option>品牌PR</option>
            <option>市场报告</option>
            <option>其他</option>
          </select>
          <select id="quality-filter" class="filter-select">
            <option value="">PR质量：全部</option>
            <option>A</option><option>B</option><option>C</option><option>待判断</option>
          </select>
          <input id="search" class="filter-input" placeholder="搜索品牌 / 行业 / 事件" />
          <button id="reset" class="link-button">重置</button>
        </section>

        <section id="kpis" class="kpi-grid"></section>
        <section id="tab-body"></section>
      </section>
    </main>
  </div>
  <script src="../../assets/common.js"></script>
  <script src="../../assets/leads_intelligence_v1.js"></script>
</body>
</html>
