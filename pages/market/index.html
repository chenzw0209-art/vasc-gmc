<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行业研究门户 · Amazon US</title>
  <link rel="stylesheet" href="../../assets/portal.css" />
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e5eaf2;
      --soft: #f8fafc;
      --blue: #2563eb;
      --green: #059669;
      --orange: #ea580c;
      --purple: #7c3aed;
      --red: #dc2626;
      --shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
    }

    .research-shell {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      height: 100vh;
      min-width: 0;
    }

    .research-sidebar {
      min-height: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .sidebar-head {
      padding: 20px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-title {
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .app-nav {
      display: grid;
      gap: 8px;
    }

    .app-nav a {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      color: #334155;
      text-decoration: none;
      font-weight: 750;
    }

    .app-nav a.active {
      background: #eaf2ff;
      color: #1d4ed8;
    }

    .industry-search-wrap {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--line);
    }

    #industry-search {
      width: 100%;
      height: 36px;
      border: 1px solid #d6e0ef;
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
    }

    .industry-tree {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px 12px 16px;
    }

    .tree-group {
      margin-bottom: 6px;
    }

    .tree-domain {
      margin-bottom: 10px;
      border: 1px solid #dbe4ef;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .tree-domain-head {
      width: 100%;
      min-height: 48px;
      border: 0;
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      color: #0f172a;
      cursor: pointer;
      text-align: left;
    }

    .tree-domain-head span {
      display: grid;
      gap: 1px;
    }

    .tree-domain-head strong {
      font-size: 14px;
      letter-spacing: 0.06em;
    }

    .tree-domain-head small {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .tree-domain-head i {
      color: var(--muted);
      font-style: normal;
      font-size: 16px;
    }

    .tree-domain-body {
      padding: 7px;
    }

    .tree-domain:not(.open) .tree-domain-body {
      display: none;
    }

    .tree-l1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 38px;
      border: 0;
      background: transparent;
      color: #0f172a;
      font-weight: 850;
      text-align: left;
      cursor: pointer;
      border-radius: 10px;
      padding: 0 10px;
    }

    .tree-l1 span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-l1 b {
      flex: 0 0 auto;
      min-width: 22px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 11px;
    }

    .tree-l1.active {
      color: #1d4ed8;
      background: #eff6ff;
    }

    .tree-l1-meta {
      display: flex !important;
      align-items: center;
      gap: 7px;
      overflow: visible !important;
    }

    .tree-l1:hover,
    .tree-l2:hover {
      background: #f1f5f9;
    }

    .tree-l1 .chev {
      color: var(--muted);
      font-size: 12px;
    }

    .tree-l2-list {
      display: grid;
      gap: 4px;
      margin: 4px 0 8px;
      padding-left: 10px;
    }

    .tree-group:not(.open) .tree-l2-list {
      display: none;
    }

    .tree-l2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #1e293b;
      text-align: left;
      cursor: pointer;
      padding: 0 10px 0 16px;
      line-height: 32px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-l2 span {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-l2 i {
      flex: 0 0 auto;
      margin-left: 8px;
      color: #64748b;
      font-size: 9px;
      font-style: normal;
      text-transform: uppercase;
    }

    .tree-l2 em {
      display: none;
    }

    .tree-l2.active {
      background: #eaf2ff;
      color: #1d4ed8;
      font-weight: 850;
      box-shadow: inset 3px 0 0 #2563eb;
    }

    .research-brief-layout {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 14px;
    }

    .household-research-layout {
      max-width: 1320px;
      margin: 0 auto 24px;
    }

    .household-hero {
      padding: 18px;
      overflow: hidden;
      background:
        radial-gradient(circle at 92% 12%, rgba(37, 99, 235, 0.14), transparent 32%),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 52%, #eff6ff 52%, #ffffff 100%);
      border-color: #bfdbfe;
    }

    .household-hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.8fr);
      gap: 18px;
      align-items: stretch;
    }

    .household-hero-copy {
      min-width: 0;
      color: #fff;
    }

    .household-hero-copy .research-kicker { color: #bfdbfe; }

    .household-hero-copy h2 {
      margin: 0;
      max-width: 760px;
      color: #fff;
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: -0.02em;
    }

    .household-hero-copy p {
      margin: 14px 0 0;
      max-width: 820px;
      color: #dbeafe;
      font-size: 15px;
      line-height: 1.72;
    }

    .household-metric-strip {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      min-width: 0;
    }

    .household-metric-strip div {
      min-width: 0;
      padding: 14px;
      border: 1px solid rgba(191, 219, 254, 0.76);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.09);
    }

    .household-metric-strip span,
    .household-metric-strip strong { display: block; }

    .household-metric-strip span {
      color: #64748b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .household-metric-strip strong {
      margin-top: 8px;
      color: #0f172a;
      font-size: 24px;
      line-height: 1.1;
    }

    .household-source-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(191, 219, 254, 0.4);
    }

    .household-source-line span {
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #dbeafe;
      font-size: 12px;
      font-weight: 750;
    }

    .research-thesis {
      background: linear-gradient(135deg, #eff6ff 0%, #ffffff 72%);
      border-color: #bfdbfe;
    }

    .research-kicker {
      margin-bottom: 10px;
      color: #2563eb;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .research-thesis p {
      margin: 0;
      color: #172554;
      font-size: 18px;
      font-weight: 760;
      line-height: 1.75;
    }

    .research-source-card dl {
      display: grid;
      gap: 9px;
      margin: 0;
    }

    .research-source-card dl div {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eef2f7;
    }

    .research-source-card dt {
      color: var(--muted);
    }

    .research-source-card dd {
      margin: 0;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .research-point-list {
      display: grid;
      gap: 9px;
    }

    .research-point-list > div {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 10px;
      border-radius: 10px;
      background: #f8fafc;
      line-height: 1.55;
    }

    .research-point-list b {
      color: #2563eb;
      font-size: 11px;
    }

    .research-contradictions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .research-contradictions article {
      min-width: 0;
      padding: 12px;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      background: #fff7ed;
    }

    .research-contradictions b {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ea580c;
      color: #fff;
      font-size: 11px;
    }

    .research-contradictions p {
      margin: 9px 0 0;
      line-height: 1.6;
    }

    .research-metric-list {
      display: grid;
      gap: 4px;
    }

    .research-metric-list > div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #eef2f7;
    }

    .research-metric-list span {
      color: var(--muted);
    }

    .research-metric-list strong {
      text-align: right;
    }

    .household-subcategory-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .household-subcategory-grid article {
      min-width: 0;
      padding: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #f8fafc;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
    }

    .household-subcategory-grid article.tier-high { border-color: #bbf7d0; background: #f0fdf4; }
    .household-subcategory-grid article.tier-mid { border-color: #bfdbfe; background: #eff6ff; }
    .household-subcategory-grid article.tier-watch { border-color: #fed7aa; background: #fff7ed; }
    .household-subcategory-grid article.tier-low { border-color: #e9d5ff; background: #faf5ff; }

    .household-subcategory-grid b,
    .household-subcategory-grid strong,
    .household-subcategory-grid span {
      display: block;
    }

    .household-subcategory-grid b {
      font-size: 14px;
    }

    .household-subcategory-grid strong {
      margin-top: 8px;
      font-size: 20px;
      color: #0f172a;
    }

    .household-subcategory-grid span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .household-subcategory-grid p {
      margin: 10px 0 0;
      color: #334155;
      line-height: 1.55;
    }

    .household-matrix-card,
    .household-priority-card,
    .household-trend-card {
      min-width: 0;
    }

    .household-matrix {
      position: relative;
      height: 380px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(15, 23, 42, 0.18) calc(50% - 1px), rgba(15, 23, 42, 0.18) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(0deg, transparent calc(50% - 1px), rgba(15, 23, 42, 0.18) calc(50% - 1px), rgba(15, 23, 42, 0.18) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(90deg, rgba(226,232,240,0.65) 1px, transparent 1px) 0 0 / 25% 100%,
        linear-gradient(0deg, rgba(226,232,240,0.65) 1px, transparent 1px) 0 0 / 100% 25%,
        linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    }

    .matrix-quadrant {
      position: absolute;
      z-index: 1;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: #94a3b8;
      font-size: 10px;
      font-weight: 850;
      pointer-events: none;
    }

    .matrix-quadrant.q1 { right: 12px; top: 12px; }
    .matrix-quadrant.q2 { left: 12px; top: 34px; }
    .matrix-quadrant.q3 { left: 12px; bottom: 32px; }
    .matrix-quadrant.q4 { right: 12px; bottom: 32px; }

    .matrix-axis {
      position: absolute;
      color: #64748b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      z-index: 1;
    }

    .matrix-axis.y {
      left: 10px;
      top: 10px;
    }

    .matrix-axis.x {
      right: 12px;
      bottom: 10px;
    }

    .matrix-bubble {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: var(--s);
      height: var(--s);
      border: 0;
      border-radius: 999px;
      color: #0f172a;
      cursor: default;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
      display: grid;
      place-items: center;
      gap: 1px;
      padding: 0 9px;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .matrix-bubble em {
      display: block;
      color: currentColor;
      font-size: 9px;
      font-style: normal;
      font-weight: 750;
      opacity: 0.75;
    }

    .matrix-bubble.tier-high { background: #bbf7d0; color: #14532d; }
    .matrix-bubble.tier-mid { background: #bfdbfe; color: #1e3a8a; }
    .matrix-bubble.tier-watch { background: #fed7aa; color: #7c2d12; }
    .matrix-bubble.tier-low { background: #e9d5ff; color: #581c87; }

    .matrix-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .matrix-legend span {
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 850;
    }

    .matrix-legend .tier-high { background: #dcfce7; color: #166534; }
    .matrix-legend .tier-mid { background: #dbeafe; color: #1d4ed8; }
    .matrix-legend .tier-watch { background: #ffedd5; color: #c2410c; }
    .matrix-legend .tier-low { background: #f3e8ff; color: #7e22ce; }

    .priority-lanes {
      display: grid;
      gap: 9px;
    }

    .priority-lanes section {
      display: grid;
      gap: 7px;
      padding: 11px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .priority-lanes section > b {
      color: #0f172a;
      font-size: 13px;
    }

    .priority-lanes div {
      padding: 10px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04);
    }

    .priority-lanes div.tier-high { border-left: 4px solid #22c55e; }
    .priority-lanes div.tier-mid { border-left: 4px solid #3b82f6; }
    .priority-lanes div.tier-watch { border-left: 4px solid #f97316; }
    .priority-lanes div.tier-low { border-left: 4px solid #a855f7; }

    .priority-lanes strong,
    .priority-lanes span {
      display: block;
    }

    .priority-lanes span {
      margin-top: 3px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.45;
    }

    .household-trend-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .household-trend-grid article {
      min-width: 0;
      padding: 11px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
    }

    .household-trend-grid header,
    .household-trend-grid footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .household-trend-grid header b {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .household-trend-grid header span,
    .household-trend-grid footer {
      color: #64748b;
      font-size: 11px;
    }

    .household-trend-grid svg {
      display: block;
      width: 100%;
      height: 46px;
      margin: 8px 0;
      overflow: visible;
    }

    .household-trend-grid svg path {
      fill: none;
      stroke: #2563eb;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .household-trend-grid footer em {
      font-style: normal;
      color: #0f172a;
      font-weight: 800;
    }

    .data-source {
      border-top: 1px solid var(--line);
      padding: 14px 18px 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .research-main {
      min-width: 0;
      height: 100vh;
      overflow: auto;
      padding: 16px 18px 18px;
    }

    .main-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      width: 100%;
      max-width: none;
      margin: 0 0 8px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .page-heading { width: 100%; }

    .metrics-grid:empty,
    .viewpoints-grid:empty {
      display: none;
    }

    .research-main.rollup-mode .main-top {
      display: none;
    }

    .research-main.rollup-mode .tabs {
      margin-top: 0;
    }

    .page-heading p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .header-actions { display: none; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(116px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: none;
      margin: 0 0 12px;
    }

    .metric-card,
    .view-card,
    .module-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .metric-card {
      height: 74px;
      min-height: 74px;
      padding: 8px 10px;
    }

    .metric-card b,
    .metric-card .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      display: block;
    }

    .metric-card strong,
    .metric-card .value {
      display: block;
      margin-top: 6px;
      font-size: 22px;
      line-height: 1;
      font-weight: 900;
      color: #0b2a6f;
      white-space: nowrap;
    }

    .metric-card span,
    .metric-card .note {
      display: block;
      margin-top: 4px;
      color: #334155;
      font-size: 11px;
      line-height: 1.35;
    }

    .viewpoints-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      max-width: none;
      margin: 0 0 8px;
    }

    .view-card {
      height: 104px;
      min-height: 104px;
      padding: 14px 16px;
      border-color: #dbeafe;
      background: linear-gradient(135deg, #ffffff 0%, #f7fbff 100%);
      overflow: hidden;
    }

    .view-card:nth-child(2) {
      border-color: #fed7aa;
      background: linear-gradient(135deg, #ffffff 0%, #fff7ed 100%);
    }

    .view-card:nth-child(3) {
      border-color: #bbf7d0;
      background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
    }

    .view-card:nth-child(4) {
      border-color: #ddd6fe;
      background: linear-gradient(135deg, #ffffff 0%, #faf5ff 100%);
    }

    .view-card h2,
    .view-card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.2;
    }

    .view-card h3 span {
      display: inline-grid;
      place-items: center;
      width: 16px;
      height: 16px;
      margin-right: 6px;
      border-radius: 999px;
      background: #ffffff;
      color: var(--blue);
      font-size: 10px;
      border: 1px solid currentColor;
    }

    .view-card p {
      margin: 0 0 7px;
      color: #102a56;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .view-card ul {
      margin: 0;
      padding-left: 0;
      color: #1e293b;
      font-size: 12px;
      line-height: 1.35;
