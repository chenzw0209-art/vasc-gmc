<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周报中心 · 全球增长洞察</title>
  <link rel="stylesheet" href="./assets/intelligence_workbench_v1.css?v=20260608-weekly-h" />
</head>
<body class="weekly-page">
  <div class="app-shell weekly-shell">
    <aside class="app-sidebar">
      <div class="brand-row"><span class="brand-mark">G</span><span>全球增长洞察（通用版）</span></div>
      <nav class="side-nav">
        <a class="active" href="#weekly" data-view-link="weekly">周报</a>
        <a href="#market" data-view-link="market">行业研究</a>
      </nav>
      <footer class="sidebar-foot"></footer>
    </aside>

    <main class="app-main weekly-main">
      <section class="weekly-content portal-view active" id="weekly-view">
        <header class="report-header">
          <div>
            <h1 class="report-title">周报中心</h1>
          </div>
          <select class="week-selector" aria-label="周次">
            <option value="W25" selected>周次：2026-W25（06.16 - 06.22）</option>
            <option value="W24">周次：2026-W24（06.09 - 06.15）</option>
          </select>
        </header>

        <section id="sales-focus"></section>

        <section class="report-row report-row-customer">
          <article class="data-card customer-table-card">
            <div class="card-title-row">
              <h2 class="card-title">本周出海企业动态</h2>
            </div>
            <div id="customer-table"></div>
          </article>
        </section>

        <section class="report-row report-row-events">
          <article class="data-card event-window-card">
            <div class="card-title-row">
              <h2 class="card-title">本周重点关注展会</h2>
            </div>
            <div id="event-windows"></div>
          </article>
        </section>

        <section class="report-row report-row-insight">
          <article class="data-card industry-brief-card">
            <div class="card-title-row">
              <h2 id="industry-brief-title" class="card-title">本周关注行业</h2>
              <select id="industry-filter" class="compact-select" aria-label="本周关注行业"></select>
            </div>
            <div id="industry-brief"></div>
          </article>
          <article class="data-card similar-customers-card">
            <h2 id="similar-title" class="card-title">同类客户</h2>
            <div id="similar-customers"></div>
          </article>
        </section>
      </section>
      <section class="market-content portal-view" id="market-view" aria-label="行业研究"></section>
    </main>
  </div>
  <script src="./assets/common.js"></script>
  <script src="./assets/weekly_report_v1.js?v=20260608-weekly-h"></script>
</body>
</html>
