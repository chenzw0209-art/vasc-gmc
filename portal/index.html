<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>增长情报门户</title>
    <link rel="stylesheet" href="./assets/portal.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">增长情报门户</div>
        <nav class="nav">
          <a class="active" href="./index.html">周报</a>
          <a href="./pages/leads/">线索</a>
          <a href="./pages/market/">市场</a>
          <a href="./pages/players/">玩家</a>
          <a href="./pages/products/">产品</a>
          <a href="#">创意</a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <input class="search" placeholder="搜索市场 / 玩家 / 产品 / 增长信号" />
          <div class="toolbar">
            <select class="select">
              <option>Amazon 美国</option>
              <option>Amazon 墨西哥</option>
              <option>Amazon 日本</option>
              <option>Amazon 巴西</option>
            </select>
          </div>
        </header>
        <section class="content">
          <h1 class="page-title">增长情报后台</h1>
          <p class="page-subtitle">当前 V1 聚焦 Amazon 四国，先把市场、玩家、产品的解释链路跑通。</p>

          <div class="grid-kpi">
            <a class="card" href="./pages/market/">
              <div class="kpi-label">市场</div>
              <div class="kpi-value">V1</div>
              <div class="kpi-note">为什么做这个行业</div>
            </a>
            <a class="card" href="./pages/players/">
              <div class="kpi-label">玩家</div>
              <div class="kpi-value">V1</div>
              <div class="kpi-note">为什么打这个客户</div>
            </a>
            <a class="card" href="./pages/products/">
              <div class="kpi-label">产品</div>
              <div class="kpi-value">V1</div>
              <div class="kpi-note">为什么打这个产品</div>
            </a>
            <a class="card" href="./pages/leads/">
              <div class="kpi-label">线索</div>
              <div class="kpi-value">MVP</div>
              <div class="kpi-note">什么时候打</div>
            </a>
          </div>

          <div class="panel">
            <h2 class="panel-title">当前口径</h2>
            <p class="muted">市场页按单一国家和平台展示，默认 Amazon 美国；玩家页以 Amazon 品牌为主；产品页当前是产品机会簇，等待 SKU 级产品底表接入后升级为产品事实表。</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
