<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周报中心 · 全球增长洞察</title>
  <link rel="stylesheet" href="./assets/intelligence_workbench_v1.css" />
</head>
<body class="weekly-page">
  <div class="app-shell weekly-shell">
    <aside class="app-sidebar">
      <div class="brand-row"><span class="brand-mark">G</span><span>全球增长洞察（通用版）</span></div>
      <nav class="side-nav">
        <a class="active" href="./index.html">周报</a>
        <a href="./pages/leads/">线索</a>
        <a href="./pages/market/">行业研究</a>
      </nav>
      <footer class="sidebar-foot">
        <span>数据来源：Softtime Amazon数据 / 公开数据</span>
        <span>当前周次：2026-W23</span>
      </footer>
    </aside>

    <main class="app-main weekly-main">
      <section class="weekly-content">
        <header class="report-header">
          <div>
            <h1 class="report-title">周报中心</h1>
            <p class="report-subtitle">情报周报 · Consumer Tech · Amazon美国站</p>
          </div>
          <select class="week-selector" aria-label="周次">
            <option>周次：2026-W23（06.02 - 06.08）</option>
          </select>
        </header>

        <section id="sales-focus"></section>

        <section class="report-row report-row-main">
          <article class="data-card customer-table-card">
            <h2 class="card-title">本周重点关注客户 Top10</h2>
            <div id="customer-table"></div>
          </article>
          <article class="data-card industry-brief-card">
            <div class="card-title-row">
              <h2 id="industry-brief-title" class="card-title">客户对应行业扫盘</h2>
              <a id="industry-link" href="./pages/market/">查看完整行业研究</a>
            </div>
            <div id="industry-brief"></div>
          </article>
        </section>

        <section class="report-row report-row-secondary">
          <article class="data-card event-window-card">
            <h2 class="card-title">本周 / 下周重点展会</h2>
            <div id="event-windows"></div>
          </article>
          <article class="data-card similar-customers-card">
            <h2 id="similar-title" class="card-title">同类客户</h2>
            <div id="similar-customers"></div>
          </article>
        </section>
      </section>
    </main>
  </div>
  <script src="./assets/common.js"></script>
  <script src="./assets/weekly_report_v1.js"></script>
</body>
</html>
